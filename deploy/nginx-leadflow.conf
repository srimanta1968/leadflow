# leadflow.projexlight.com
#
# A SEPARATE FILE from cloud.projexlight.com.conf on purpose: editing that file
# to add LeadFlow would put both products one typo away from each other, and
# nginx -t failing would block a ProjexCloud change for a LeadFlow reason.
#
# certbot --nginx -d leadflow.projexlight.com adds the TLS block below.

server {
    listen 80;
    server_name leadflow.projexlight.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name leadflow.projexlight.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/leadflow.projexlight.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/leadflow.projexlight.com/privkey.pem;

    root /usr/share/nginx/leadflow;
    index index.html;

    # The API. 127.0.0.1 because the container publishes to loopback only —
    # anything reaching the API must pass through TLS here first.
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The event stream is long-lived; buffering it delivers nothing until
        # the buffer fills, which looks like a dead feed.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback. Every client route is served by index.html, or a deep link
    # such as /app/contacts/:id/overview 404s on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # keeps serving the previous bundle from the browser.
    location ~* \.(js|css|woff2?|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
